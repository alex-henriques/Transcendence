# Edge reverse proxy. Terminates TLS for every external connection; routes
# /api and /ws to the Fastify backend and everything else to the SPA.

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wkb.crt;
    ssl_certificate_key /etc/nginx/certs/wkb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Someone typing http://host:8443 gets bounced to https instead of
    # nginx's raw "plain HTTP request sent to HTTPS port" error.
    # $http_host, not $host:$server_port: the latter is the container's 443,
    # not the port the browser actually connected to.
    error_page 497 https://$http_host$request_uri;

    # Avatar uploads are the only user-supplied bytes we serve back.
    client_max_body_size 4m;

    # The default error pages print the exact nginx version, which is free
    # reconnaissance and buys nothing.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy           "same-origin"    always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # $http_host everywhere below, for the same reason as the 497 above: it is
    # the address the browser connected to, port included, and the API builds
    # OAuth redirects from it. $host drops the port and $server_port is the
    # container's 443, so neither survives being reached on 8443.

    # --- WebSocket channels: /ws/lobby and /ws/room --------------------------
    location /ws/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A match can sit on the reveal screen; do not cut idle sockets early.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # --- Fault pages ---------------------------------------------------------
    # Two different answers, because two different callers ask. A browser
    # asking for a screen gets a page it can read; `fetch` asking for JSON gets
    # JSON in the shape the client already parses, rather than an HTML blob it
    # has to guess at.
    location = /50x.html {
        root /etc/nginx/error;
        internal;
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":{"code":"error.serviceUnavailable"}}';
    }

    # --- REST API ------------------------------------------------------------
    location /api/ {
        error_page 502 503 504 = @api_unavailable;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # --- SPA -----------------------------------------------------------------
    location / {
        error_page 502 503 504 /50x.html;
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
